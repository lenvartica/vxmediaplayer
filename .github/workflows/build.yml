name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: VxPlayer-windows-x64
          - os: ubuntu-22.04
            artifact: VxPlayer-linux-x64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Package Windows executable with LibVLC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install vlc --no-progress -y
          choco install innosetup --no-progress -y
          $vlc = "${env:ProgramFiles}\VideoLAN\VLC"
          if (-not (Test-Path "$vlc\libvlc.dll")) { throw "LibVLC was not installed at $vlc" }
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name VxPlayer `
            --icon src/assets/vxplayer.ico `
            --add-data "$vlc;vlc" `
            --add-data "src/assets;assets" `
            --runtime-hook src/vlc_runtime_hook.py `
            src/main.py
          Copy-Item dist\VxPlayer.exe "$env:RUNNER_TEMP\VxPlayer.exe"
          Compress-Archive `
            -Path "$env:RUNNER_TEMP\VxPlayer.exe", "README.md", "LICENSE" `
            -DestinationPath "$env:RUNNER_TEMP\VxPlayer-windows-x64.zip" `
            -CompressionLevel Optimal
          & "$env:RUNNER_TEMP\VxPlayer.exe" --check-libvlc
          if ($LASTEXITCODE -ne 0) { throw "Bundled LibVLC smoke test failed with exit code $LASTEXITCODE" }
          $isccCommand = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($isccCommand) {
            $iscc = $isccCommand.Source
          } else {
            $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not found: $iscc" }
          if ($env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)$') {
            $appVersion = $Matches[1]
          } else {
            $appVersion = "0.0.$env:GITHUB_RUN_NUMBER"
          }
          Push-Location installer
          try {
            & $iscc "/DAppVersion=$appVersion" "/O$env:RUNNER_TEMP" "VxPlayer.iss"
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          $installerPath = Join-Path $env:RUNNER_TEMP "VxPlayer-Setup.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "install-smoke"
          $installerLog = Join-Path $env:RUNNER_TEMP "vxplayer-installer-smoke.log"
          $installerArgs = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/DIR=`"$installDir`"",
            "/LOG=`"$installerLog`""
          )
          $installerProcess = Start-Process -FilePath $installerPath -ArgumentList $installerArgs -Wait -PassThru
          if ($installerProcess.ExitCode -ne 0) { throw "Installer smoke test failed with exit code $($installerProcess.ExitCode)" }
          $installedExe = Join-Path $installDir "VxPlayer.exe"
          if (-not (Test-Path $installedExe)) {
            Get-Content $installerLog -Tail 80
            throw "Installer did not install VxPlayer.exe into $installDir"
          }
          & $installedExe --check-libvlc
          if ($LASTEXITCODE -ne 0) { throw "Installed VxPlayer LibVLC smoke test failed with exit code $LASTEXITCODE" }
          $uninstaller = Start-Process `
            -FilePath (Join-Path $installDir "unins000.exe") `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
            -Wait -PassThru
          if ($uninstaller.ExitCode -ne 0) { throw "Installer uninstall smoke test failed with exit code $($uninstaller.ExitCode)" }
      - name: Package Linux executable
        if: runner.os == 'Linux'
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --name VxPlayer \
            --add-data "src/assets:assets" \
            src/main.py
          cp dist/VxPlayer "$RUNNER_TEMP/VxPlayer-linux-x64"
          mkdir -p "$RUNNER_TEMP/vxplayer-linux-package"
          cp dist/VxPlayer "$RUNNER_TEMP/vxplayer-linux-package/VxPlayer"
          cp README.md LICENSE "$RUNNER_TEMP/vxplayer-linux-package/"
          tar -czf "$RUNNER_TEMP/VxPlayer-linux-x64.tar.gz" \
            -C "$RUNNER_TEMP" vxplayer-linux-package
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/VxPlayer*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
