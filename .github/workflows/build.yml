name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: VxPlayer-windows-x64
          - os: ubuntu-22.04
            artifact: VxPlayer-linux-x64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Linux LibVLC
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev vlc-plugin-base vlc-plugin-video-output
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Package Windows executable with LibVLC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install vlc --no-progress -y
          $vlc = "${env:ProgramFiles}\VideoLAN\VLC"
          if (-not (Test-Path "$vlc\libvlc.dll")) { throw "LibVLC was not installed at $vlc" }
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name VxPlayer `
            --add-data "$vlc;vlc" `
            --runtime-hook src/vlc_runtime_hook.py `
            src/main.py
          Copy-Item dist\VxPlayer.exe "$env:RUNNER_TEMP\VxPlayer.exe"
      - name: Package Linux executable
        if: runner.os == 'Linux'
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --name VxPlayer src/main.py
          cp dist/VxPlayer "$RUNNER_TEMP/VxPlayer-linux-x64"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/VxPlayer*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
