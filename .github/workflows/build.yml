name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vxplayer-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: VxPlayer-windows-x64
          - os: ubuntu-22.04
            artifact: VxPlayer-linux-x64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test incremental update helper
        run: python -m unittest discover -s tests -v
      - name: Set Windows application version
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)$') {
            $appVersion = "$($Matches[1]).0"
          } else {
            $latestTag = git tag --list 'v[0-9]*' --sort=-version:refname | Select-Object -First 1
            if ($latestTag -match '^v(\d+\.\d+\.\d+)$') {
              $appVersion = "$($Matches[1]).$env:GITHUB_RUN_NUMBER"
            } else {
              $appVersion = "1.0.0.$env:GITHUB_RUN_NUMBER"
            }
          }
          Set-Content -Path src/app_version.py -Value "APP_VERSION = `"$appVersion`"" -Encoding Ascii
          "VXPLAYER_VERSION=$appVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Building VxPlayer $appVersion"
      - name: Set Linux application version
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}.0"
          else
            latest_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
            if [[ "$latest_tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              version="${BASH_REMATCH[1]}.${GITHUB_RUN_NUMBER}"
            else
              version="1.0.0.${GITHUB_RUN_NUMBER}"
            fi
          fi
          printf 'APP_VERSION = "%s"\n' "$version" > src/app_version.py
          echo "Building VxPlayer $version"
      - name: Package Windows executable with LibVLC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install vlc --no-progress -y
          choco install innosetup --no-progress -y
          $vlc = "${env:ProgramFiles}\VideoLAN\VLC"
          if (-not (Test-Path "$vlc\libvlc.dll")) { throw "LibVLC was not installed at $vlc" }
          python -m PyInstaller --noconfirm --clean --onedir --debug noarchive --windowed `
            --name VxPlayer `
            --icon src/assets/vxplayer.ico `
            --add-data "src/assets;assets" `
            --runtime-hook src/vlc_runtime_hook.py `
            src/main.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name VxPlayerUpdater `
            src/updater_helper.py
          $bundleDir = Join-Path $PWD "dist\VxPlayer"
          $bundleExe = Join-Path $bundleDir "VxPlayer.exe"
          if (-not (Test-Path $bundleExe)) { throw "PyInstaller did not create $bundleExe" }
          Copy-Item dist\VxPlayerUpdater.exe (Join-Path $bundleDir "VxPlayerUpdater.exe")
          $vlcBundle = Join-Path $bundleDir "vlc"
          New-Item -ItemType Directory -Path $vlcBundle -Force | Out-Null
          Copy-Item (Join-Path $vlc "*") $vlcBundle -Recurse
          $bundleCheck = Start-Process `
            -FilePath $bundleExe `
            -ArgumentList @("--check-libvlc") `
            -Wait -PassThru
          if ($bundleCheck.ExitCode -ne 0) { throw "Bundled LibVLC smoke test failed with exit code $($bundleCheck.ExitCode)" }

          python scripts\package_updates.py prepare `
            --bundle-dir $bundleDir `
            --output-dir $env:RUNNER_TEMP `
            --version $env:VXPLAYER_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Could not create update archives." }

          Compress-Archive `
            -Path "$bundleDir\*" `
            -DestinationPath "$env:RUNNER_TEMP\VxPlayer-windows-x64.zip" `
            -CompressionLevel Optimal
          $payloadPath = Join-Path $env:RUNNER_TEMP "VxPlayer-windows-x64.zip"
          $payloadHash = (Get-FileHash $payloadPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $payloadSize = (Get-Item $payloadPath).Length
          $isccCommand = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($isccCommand) {
            $iscc = $isccCommand.Source
          } else {
            $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not found: $iscc" }
          $smokeDir = Join-Path $env:RUNNER_TEMP "setup-smoke"
          New-Item -ItemType Directory -Path $smokeDir -Force | Out-Null
          Push-Location installer
          try {
            & $iscc "/DAppVersion=$env:VXPLAYER_VERSION" "/O$smokeDir" "VxPlayer.iss"
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          $fullInstallerPath = Join-Path $smokeDir "VxPlayer-Setup-Full.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "install-smoke"
          $installerLog = Join-Path $env:RUNNER_TEMP "vxplayer-installer-smoke.log"
          $installerArgs = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/DIR=`"$installDir`"",
            "/LOG=`"$installerLog`""
          )
          $installerProcess = Start-Process -FilePath $fullInstallerPath -ArgumentList $installerArgs -Wait -PassThru
          if ($installerProcess.ExitCode -ne 0) { throw "Installer smoke test failed with exit code $($installerProcess.ExitCode)" }
          $installedExe = Join-Path $installDir "VxPlayer.exe"
          if (-not (Test-Path $installedExe)) {
            Get-Content $installerLog -Tail 80
            throw "Installer did not install VxPlayer.exe into $installDir"
          }
          foreach ($requiredPath in @(
            (Join-Path $installDir "VxPlayerUpdater.exe"),
            (Join-Path $installDir "VxPlayer-install.json"),
            (Join-Path $installDir "vlc\libvlc.dll"),
            (Join-Path $installDir "_internal\assets\style.qss")
          )) {
            if (-not (Test-Path -LiteralPath $requiredPath)) {
              throw "The installer is missing a required application module: $requiredPath"
            }
          }
          $installedCheck = Start-Process `
            -FilePath $installedExe `
            -ArgumentList @("--check-libvlc") `
            -Wait -PassThru
          if ($installedCheck.ExitCode -ne 0) { throw "Installed VxPlayer LibVLC smoke test failed with exit code $($installedCheck.ExitCode)" }
          $uninstaller = Start-Process `
            -FilePath (Join-Path $installDir "unins000.exe") `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
            -Wait -PassThru
          if ($uninstaller.ExitCode -ne 0) { throw "Installer uninstall smoke test failed with exit code $($uninstaller.ExitCode)" }
          if ($env:GITHUB_REF_TYPE -eq "tag") { $releaseTag = $env:GITHUB_REF_NAME } else { $releaseTag = "continuous" }
          $payloadUrl = "https://github.com/lenvartica/vxmediaplayer/releases/download/$releaseTag/VxPlayer-windows-x64.zip"
          Push-Location installer
          try {
            & $iscc `
              "/DOnlineSetup=1" `
              "/DAppVersion=$env:VXPLAYER_VERSION" `
              "/DPayloadUrl=$payloadUrl" `
              "/DPayloadSha256=$payloadHash" `
              "/DPayloadSize=$payloadSize" `
              "/O$env:RUNNER_TEMP" `
              "VxPlayer.iss"
            if ($LASTEXITCODE -ne 0) { throw "Online Inno Setup build failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          $installerPath = Join-Path $env:RUNNER_TEMP "VxPlayer-Setup.exe"
          if ((Get-Item $installerPath).Length -gt 10MB) { throw "Online installer exceeded the 10 MB size limit" }
          $installerHash = (Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($env:GITHUB_REF_TYPE -eq "tag") { $releaseTag = $env:GITHUB_REF_NAME } else { $releaseTag = "continuous" }
          python scripts\package_updates.py manifest `
            --index "$env:RUNNER_TEMP\VxPlayer-package-index.json" `
            --output "$env:RUNNER_TEMP\VxPlayer-update.json" `
            --version $env:VXPLAYER_VERSION `
            --tag $releaseTag `
            --installer-sha256 $installerHash `
            --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Could not create the update manifest." }
          Remove-Item "$env:RUNNER_TEMP\VxPlayer-package-index.json"
      - name: Package Linux executable
        if: runner.os == 'Linux'
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --name VxPlayer \
            --add-data "src/assets:assets" \
            src/main.py
          cp dist/VxPlayer "$RUNNER_TEMP/VxPlayer-linux-x64"
          mkdir -p "$RUNNER_TEMP/vxplayer-linux-package"
          cp dist/VxPlayer "$RUNNER_TEMP/vxplayer-linux-package/VxPlayer"
          cp README.md LICENSE "$RUNNER_TEMP/vxplayer-linux-package/"
          tar -czf "$RUNNER_TEMP/VxPlayer-linux-x64.tar.gz" \
            -C "$RUNNER_TEMP" vxplayer-linux-package
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/VxPlayer*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/VxPlayer*
          generate_release_notes: true
  online_installer_smoke:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - release
    runs-on: windows-latest
    steps:
      - name: Download the published online installer
        shell: pwsh
        run: |
          $installerPath = Join-Path $env:RUNNER_TEMP "VxPlayer-Setup.exe"
          $installerUrl = "https://github.com/lenvartica/vxmediaplayer/releases/download/$env:GITHUB_REF_NAME/VxPlayer-Setup.exe"
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath
          if ((Get-Item $installerPath).Length -gt 10MB) { throw "Published online installer exceeded the 10 MB size limit" }
      - name: Install and verify the downloaded package
        shell: pwsh
        run: |
          $installerPath = Join-Path $env:RUNNER_TEMP "VxPlayer-Setup.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "online-install-smoke"
          $installerLog = Join-Path $env:RUNNER_TEMP "vxplayer-online-installer-smoke.log"
          try {
            $installerArgs = @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/DIR=`"$installDir`"",
              "/LOG=`"$installerLog`""
            )
            $installerProcess = Start-Process -FilePath $installerPath -ArgumentList $installerArgs -Wait -PassThru
            if ($installerProcess.ExitCode -ne 0) { throw "Online installer failed with exit code $($installerProcess.ExitCode)" }
            $installedExe = Join-Path $installDir "VxPlayer.exe"
            if (-not (Test-Path $installedExe)) { throw "Online installer did not install VxPlayer.exe" }
            $installedCheck = Start-Process `
              -FilePath $installedExe `
              -ArgumentList @("--check-libvlc") `
              -Wait -PassThru
            if ($installedCheck.ExitCode -ne 0) { throw "Online-installed VxPlayer LibVLC smoke test failed with exit code $($installedCheck.ExitCode)" }
            $uninstaller = Start-Process `
              -FilePath (Join-Path $installDir "unins000.exe") `
              -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
              -Wait -PassThru
            if ($uninstaller.ExitCode -ne 0) { throw "Online installer uninstall smoke test failed with exit code $($uninstaller.ExitCode)" }
          } catch {
            $diagnostic = $_.Exception.Message
            if (Test-Path $installerLog) {
              $diagnostic += "`n" + (Get-Content $installerLog -Tail 80 | Out-String)
            }
            $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($diagnostic))
            Write-Output "::error title=Online installer smoke diagnostic::$encoded"
            throw
          }
  continuous_release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Update rolling continuous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f continuous "$GITHUB_SHA"
          git push origin refs/tags/continuous --force
          if gh release view continuous >/dev/null 2>&1; then
            gh release edit continuous \
              --title "VxPlayer Continuous Build" \
              --notes "Latest successful build from main. This prerelease is updated automatically after each successful main-branch build." \
              --prerelease
          else
            gh release create continuous \
              --title "VxPlayer Continuous Build" \
              --notes "Latest successful build from main. This prerelease is updated automatically after each successful main-branch build." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
          gh release upload continuous release-assets/VxPlayer* --clobber
